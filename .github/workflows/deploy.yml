name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-flight one, but never cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.21.14   # keep in step with Dockerfile / devcontainer.json

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('Cargo.lock') }}
      # Native (non-WASM) run of calc's decimal tests plus app's format/chart tests.
      # `taxkit/mock` is the fictional tax system `calc` will test against. It is
      # behind a feature so it never reaches the wasm bundle, which also means
      # `--workspace` alone would silently skip its tests.
      - run: cargo test --workspace --features taxkit/mock
      # The jurisdiction boundary is the crates' central invariant and is
      # otherwise protected only by someone remembering to run these by hand.
      # `taxkit` must name no country (mock.rs is a fictional one, on purpose)
      # and `calc` must never reach `uktax`.
      - name: taxkit names no jurisdiction
        run: |
          ! grep -rniE "isa|sipp|pension|hmrc|scotland|england|£|gbp" taxkit/src \
            --include=*.rs | grep -v "^taxkit/src/mock.rs"
      - name: calc does not depend on uktax
        run: "! cargo tree -p calc | grep -q uktax"

  # Headless-browser suite for the App component and its children
  # (app/tests/ui.rs). ubuntu-latest ships Firefox + geckodriver already, so we
  # only add the wasm-bindgen test runner. See test.Dockerfile for the local run.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ui-${{ hashFiles('Cargo.lock') }}
      # wasm-bindgen-test-runner must match the wasm-bindgen version in
      # Cargo.lock exactly, or it rejects the module ("schema version mismatch").
      # $GECKOWEBDRIVER is a runner OS env var, so it must be resolved in a shell
      # and forwarded via $GITHUB_ENV — the `${{ env.* }}` expression context does
      # not see runner-level variables, and would leave GECKODRIVER as just
      # "/geckodriver".
      - name: Install wasm-bindgen-test-runner and point at geckodriver
        run: |
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen ${WB}"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WB}/wasm-bindgen-${WB}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzf- --strip-components=1 -C /usr/local/bin
          if [ -x "${GECKOWEBDRIVER}/geckodriver" ]; then
            echo "GECKODRIVER=${GECKOWEBDRIVER}/geckodriver" >> "$GITHUB_ENV"
          elif command -v geckodriver >/dev/null; then
            echo "GECKODRIVER=$(command -v geckodriver)" >> "$GITHUB_ENV"
          else
            echo "geckodriver not found (GECKOWEBDRIVER=${GECKOWEBDRIVER:-unset})" >&2
            exit 1
          fi
      - run: cargo test -p app --target wasm32-unknown-unknown --test ui

  deploy:
    needs: [test, ui]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add wasm32-unknown-unknown

      # Trunk's own prebuilt binary - seconds, vs ~2 min for `cargo install trunk`.
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C /usr/local/bin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/trunk     # wasm-bindgen-cli + wasm-opt that Trunk downloads
            target
          key: cargo-wasm-${{ hashFiles('Cargo.lock') }}

      - uses: actions/configure-pages@v5

      # Trunk must run from inside app/ - virtual workspace, see CLAUDE.md.
      # --public-url makes the emitted asset hrefs relative so they resolve
      # under the /investment-projection/ subpath.
      - name: Build
        working-directory: app
        run: trunk build --release --public-url ./

      # Belt and braces; the Pages Actions path doesn't run Jekyll anyway.
      - run: touch app/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
