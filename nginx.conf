server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx's bundled mime.types (html/css/js/svg/...) is already included in
    # the http context. We only override .wasm here so the full MIME map is
    # preserved for any assets added later, while WebAssembly is still served
    # as application/wasm for `WebAssembly.instantiateStreaming`.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
    }
}
