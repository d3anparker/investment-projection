[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Leptos (Rust/WASM) front end for the investment projection core"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
calc = { path = "../calc" }
taxkit = { path = "../taxkit" }
# The one line that names a jurisdiction; see `convert::TAX_SYSTEM`.
uk-tax = { path = "../uk-tax" }
de-tax = { path = "../de-tax" }
rust_decimal = { version = "1", features = ["maths"] }
console_error_panic_hook = "0.1"
# The shareable link is a base64url-encoded JSON snapshot of the form state
# (`share.rs`). serde/serde_json give the JSON round-trip and base64 the URL-safe
# text — all pure Rust, so the codec stays natively testable off the browser.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Explicit web-sys features for the shareable-link plumbing (reading/writing the
# location hash and copying to the clipboard), rather than relying on whichever
# features Leptos's `csr` happens to pull in.
web-sys = { version = "0.3", features = ["History", "Location", "Navigator", "Clipboard"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Test-only DOM surface for app/tests/ui.rs. Resolver 2 keeps these dev-dep
# feature activations out of the `trunk build` graph, so the shipped wasm keeps
# exactly the web-sys features declared above and no more.
web-sys = { version = "0.3", features = [
  "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlButtonElement", "Node", "NodeList", "DomTokenList", "Event", "EventInit",
  "KeyboardEvent", "KeyboardEventInit", "PointerEvent", "PointerEventInit",
  "CssStyleDeclaration", "HtmlStyleElement", "Window", "Location",
] }
